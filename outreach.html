  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .head { display:flex; align-items:center; gap:8px; }
  .num { flex:0 0 auto; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; background:var(--ink); color:#fff; font-size:12px; font-weight:600; }

  .msg { margin:10px 0 0; padding:12px; background:#faf9f5; border:1px solid var(--line); border-radius:8px; font-size:14.5px; line-height:1.5; color:var(--body); white-space:pre-wrap; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; min-height:48px; border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:#fff; font-size:15px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .btn:active { transform:scale(.98); }
  .btn.ig { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn.copy.ok { background:var(--ok); border-color:var(--ok); }
  .toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:.2s; z-index:10; }

function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function render(){
  document.getElementById('list').innerHTML = LEADS.map(function(l, i){
    return '<div class="card">' +
      '<div class="head"><span class="num">' + (i+1) + '</span>' +
      '<span class="name">@' + esc(l.n) + '</span></div>' +
      '<div class="msg">' + esc(l.m) + '</div>' +
      '<div class="actions">' +
        '<a class="btn ig" href="https://www.instagram.com/' + esc(l.n) + '" target="_blank" rel="noopener">Instagram</a>' +
        '<button class="btn copy" data-idx="' + i + '">Копіювати</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function copyText(t){
  function done(){ toast('Скопійовано ✓'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(function(){ fallback(t); done(); });
  } else { fallback(t); done(); }
}
function fallback(t){
  var ta = document.createElement('textarea'); ta.value = t;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
var toastTimer;
function toast(t){
  var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1600);
}

document.getElementById('list').addEventListener('click', function(e){
  var b = e.target.closest('.copy');
  if (!b) return;
  var lead = LEADS[+b.dataset.idx];
  copyText(lead.m);
  b.textContent = 'Скопійовано ✓'; b.classList.add('ok');
  setTimeout(function(){ b.textContent = 'Копіювати'; b.classList.remove('ok'); }, 1400);
});

render();
