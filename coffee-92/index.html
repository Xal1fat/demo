<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>92° — зерно, техника и бар</title>
<meta name="description" content="92° — спешелти-обжарка, кофейная техника и бар в Москве. Свежеобжаренное зерно, кофемашины, кофемолки, аксессуары и меню кофейни.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317140F'/%3E%3Ctext x='6' y='23' font-family='Georgia,serif' font-size='16' fill='%23EDEAE1'%3E92%C2%B0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="92° — на главную">
    <span class="brand-mark">92°</span>
    <span class="brand-word">градус</span>
  </a>

  <nav class="nav" aria-label="Основная навигация">
    <a href="#/" data-nav="home">Главная</a>
    <a href="#/beans" data-nav="beans">Зерно</a>
    <a href="#/tech" data-nav="tech">Техника</a>
    <a href="#/bar" data-nav="bar">Бар</a>
  </nav>

  <button class="cart-open" type="button" id="cartOpen" aria-controls="cart" aria-expanded="false">
    <span>Корзина</span>
    <span class="cart-badge" id="cartBadge" hidden>0</span>
  </button>
</header>

<main id="app"></main>

<footer class="footer">
  <div>
    <p class="footer-brand">обжарка · техника · бар</p>
    <p>92° — демо-сайт. Названия, цены и адрес выдуманы, корзина хранит данные только в браузере, заказы никуда не отправляются.</p>
  </div>
  <nav class="footer-nav" aria-label="Навигация в подвале">
    <a href="#/beans">Зерно</a>
    <a href="#/tech">Техника</a>
    <a href="#/bar">Бар</a>
  </nav>
</footer>

<!-- Корзина -->
<div class="cart-veil" id="cartVeil" hidden></div>
<aside class="cart" id="cart" aria-hidden="true" aria-label="Корзина">
  <div class="cart-head">
    <h2>Корзина</h2>
    <button class="cart-close" type="button" id="cartClose" aria-label="Закрыть корзину">×</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <p class="cart-total"><span>Итого</span><strong id="cartTotal">0 ₽</strong></p>
    <button class="btn btn--solid btn--wide" type="button" id="checkout">Оформить заказ</button>
    <p class="cart-hint" id="cartHint">Бесплатная доставка от 3 000 ₽</p>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
