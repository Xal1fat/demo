<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адмінка · замовлення посібника (демо)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#241a15">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #f6f2ec; }
  .admin-head { background: var(--dark); color: #f7efe9; padding: 16px 0; }
  .admin-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .admin-head h1 { font-family: var(--serif); font-size: 20px; margin: 0; color: #fff; font-weight: 400; }
  .admin-head a { color: #d9c6bb; font-size: 13px; text-decoration: none; border-bottom: 1px solid rgba(217,198,187,.4); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 18px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat b { display: block; font-family: var(--serif); font-size: 26px; line-height: 1; }
  .stat span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select {
    font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink);
  }
  .toolbar input { flex: 1 1 200px; min-width: 0; }
  .orders { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .order { display: grid; grid-template-columns: 150px minmax(0,1.5fr) 90px 120px auto; gap: 12px; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .order:last-child { border-bottom: none; }
  .onum { min-width: 0; }
  .order .when { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  .status { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-radius: 999px;
    padding: 4px 9px; white-space: nowrap; justify-self: start; }
  .status.awaiting { background: #fdf1dc; color: #8a5b00; border: 1px solid #f0dcb4; }
  .status.paid { background: #e8f1fd; color: #1c4f8a; border: 1px solid #c6dbf3; }
  .status.delivered { background: #e6f4e9; color: #1f6b35; border: 1px solid #bfe0c8; }
  .status.cancelled { background: #f2eeee; color: #7a6f6f; border: 1px solid #e0d8d8; }
  .row-actions { display: flex; gap: 6px; justify-self: end; }
  .row-actions button { font: inherit; font-size: 12px; padding: 8px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; white-space: nowrap; }
  .row-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row-actions button[disabled] { opacity: .5; cursor: default; }
  .empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0;
    transition: .25s; background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 999px;
    font-size: 14px; pointer-events: none; z-index: 40; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .login { max-width: 360px; margin: 60px auto; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 26px 24px; }
  .login h2 { margin-top: 0; font-size: 22px; }
  .login .field { margin-bottom: 14px; }
  @media (max-width: 820px) {
    .order { grid-template-columns: 1fr auto; gap: 8px 12px; }
    .order .onum, .order .mail, .order .amount { grid-column: 1 / -1; }
    .row-actions { grid-column: 1 / -1; justify-self: stretch; }
    .row-actions button { flex: 1; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="admin-head">
  <div class="wrap">
    <h1>Замовлення посібника</h1>
    <a href="index.html">← на сайт</a>
  </div>
</div>

<div class="wrap">
  <section id="loginView" class="login" hidden>
    <h2>Вхід в адмінку</h2>
    <p style="color:var(--body);font-size:14px;margin:0 0 18px">Демо: пароль <b>demo123</b></p>
    <form id="loginForm">
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••">
      </div>
      <p class="error" id="loginError"></p>
      <button class="btn wide" type="submit">Увійти</button>
    </form>
  </section>

  <section id="dashView" hidden>
    <div class="stats">
      <div class="stat"><b id="statNew">0</b><span>нові</span></div>
      <div class="stat"><b id="statPaid">0</b><span>оплачені</span></div>
      <div class="stat"><b id="statDelivered">0</b><span>доставлені</span></div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Пошук за email або номером">
      <select id="filter">
        <option value="all">усі статуси</option>
        <option value="awaiting_payment">нові</option>
        <option value="paid">оплачені</option>
        <option value="delivered">доставлені</option>
        <option value="cancelled">скасовані</option>
      </select>
      <button class="btn ghost small" id="exportCsv" type="button">Експорт CSV</button>
    </div>

    <div class="orders" id="orders"></div>
    <p style="font-size:12px;color:var(--muted);margin:16px 0 40px">
      Демо: дані в памʼяті сторінки, листи не надсилаються. Кнопка показує, що відбувається в робочій версії.
    </p>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var PASSWORD = 'demo123';

  var orders = [
    { number: 'CG-2026-0004', email: 'olena.k@gmail.com', amount: 499, status: 'awaiting_payment', created: '28.10 14:12' },
    { number: 'CG-2026-0003', email: 'maria.beauty@ukr.net', amount: 499, status: 'awaiting_payment', created: '28.10 12:40' },
    { number: 'CG-2026-0002', email: 'tetiana@example.com', amount: 499, status: 'delivered', created: '27.10 19:05' },
    { number: 'CG-2026-0001', email: 'iryna.cake@gmail.com', amount: 499, status: 'delivered', created: '27.10 10:31' }
  ];

  var toastEl = document.getElementById('toast');
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('on');
    setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  var STATUS_TEXT = {
    awaiting_payment: 'нове', paid: 'оплачено', delivered: 'доставлено', cancelled: 'скасовано'
  };

  function render() {
    var query = document.getElementById('search').value.trim().toLowerCase();
    var filter = document.getElementById('filter').value;
    var box = document.getElementById('orders');
    var visible = orders.filter(function (order) {
      var matchesQuery = !query || order.email.toLowerCase().includes(query) || order.number.toLowerCase().includes(query);
      var matchesFilter = filter === 'all' || order.status === filter;
      return matchesQuery && matchesFilter;
    });

    box.innerHTML = visible.map(function (order) {
      var canSend = order.status === 'awaiting_payment';
      return '<div class="order">' +
        '<div class="onum"><span class="num">' + order.number + '</span><div class="when">' + order.created + '</div></div>' +
        '<div class="mail">' + order.email + '<div class="when">лист із рахунком надіслано</div></div>' +
        '<div class="amount">' + order.amount + ' ₴</div>' +
        '<span class="status ' + order.status.replace('awaiting_payment', 'awaiting') + '">' + STATUS_TEXT[order.status] + '</span>' +
        '<div class="row-actions">' +
          '<button class="primary" data-send="' + order.number + '"' + (canSend ? '' : ' disabled') + '>Оплачено → надіслати</button>' +
          '<button data-resend="' + order.number + '">Ще раз</button>' +
        '</div>' +
      '</div>';
    }).join('');

    if (!visible.length) box.innerHTML = '<div class="empty">Нічого не знайдено</div>';

    document.getElementById('statNew').textContent = orders.filter(function (o) { return o.status === 'awaiting_payment'; }).length;
    document.getElementById('statPaid').textContent = orders.filter(function (o) { return o.status === 'paid'; }).length;
    document.getElementById('statDelivered').textContent = orders.filter(function (o) { return o.status === 'delivered'; }).length;

    box.querySelectorAll('[data-send]').forEach(function (button) {
      button.addEventListener('click', function () {
        var order = orders.find(function (o) { return o.number === button.dataset.send; });
        if (!order || order.status !== 'awaiting_payment') return;
        order.status = 'delivered';
        render();
        toast('Лист із файлом надіслано на ' + order.email);
      });
    });

    box.querySelectorAll('[data-resend]').forEach(function (button) {
      button.addEventListener('click', function () {
        var order = orders.find(function (o) { return o.number === button.dataset.resend; });
        toast('Нове посилання надіслано на ' + order.email + ' (демо)');
      });
    });
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filter').addEventListener('change', render);

  document.getElementById('exportCsv').addEventListener('click', function () {
    var rows = [['number', 'email', 'amount', 'status', 'created']].concat(
      orders.map(function (o) { return [o.number, o.email, o.amount, o.status, o.created]; })
    );
    var csv = rows.map(function (row) { return row.join(','); }).join('\n');
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    var link = document.createElement('a');
    link.href = url;
    link.download = 'orders-demo.csv';
    link.click();
    URL.revokeObjectURL(url);
    toast('CSV сформовано (демо)');
  });

  document.getElementById('loginForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var value = document.getElementById('password').value;
    if (value !== PASSWORD) {
      document.getElementById('loginError').textContent = 'Невірний пароль';
      return;
    }
    sessionStorage.setItem('cgAdmin', '1');
    showDash();
  });

  function showDash() {
    document.getElementById('loginView').hidden = true;
    document.getElementById('dashView').hidden = false;
    render();
  }

  if (sessionStorage.getItem('cgAdmin') === '1') showDash();
  else document.getElementById('loginView').hidden = false;
})();
</script>
</body>
</html>
