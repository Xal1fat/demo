<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — приклади робіт</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf7f8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23231a1d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23dd7ba3'/%3E%3C/svg%3E">
<style>
  :root{ --ink:#231a1d; --body:#5f5055; --muted:#8d7d83; --line:#e8dfe2; --bg:#fbf7f8; --pink:#dd7ba3; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center}
  .wrap{max-width:640px;margin:0 auto;padding:48px 24px}
  .code{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink);font-weight:700}
  h1{font-size:clamp(30px,6vw,44px);line-height:1.05;letter-spacing:-0.04em;margin:16px 0 14px;font-weight:800}
  p{color:var(--body);margin:0 0 26px;font-size:16px;line-height:1.6;max-width:44ch}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  a.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:13px 22px;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:opacity .2s}
  a.btn:hover{opacity:.82}
  a.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
  a:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
  .links{margin-top:38px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);
    display:flex;gap:18px;flex-wrap:wrap}
  .links a{color:var(--body);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  .links a:hover{color:var(--ink);border-color:var(--pink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">помилка 404</div>
  <h1>Такої сторінки немає</h1>
  <p>Посилання застаріло або в адресі помилка. Нижче — усе, що є на сайті.</p>
  <div class="row">
    <a class="btn" href="./">На головну</a>
    <a class="btn ghost" href="https://beauty-studio-blue.vercel.app">Живий сайт салону</a>
  </div>
  <div class="links">
    <a href="yoda-cake/">Кондитерська</a>
    <a href="kub-market/">KUB MARKET</a>
    <a href="colorist/">Колорист</a>
  </div>
</div>
</body>
</html>
